name: Exercise 3 - Docker Build and push registry

on:
  push:
jobs:
  docker:
    runs-on: ubuntu-latest

    # Required permissions for pushing to GHCR
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      
      # Login to Artifactory Docker registry
      - name: Login to Artifactory
        uses: docker/login-action@v3
        with:
          registry: trialsga2025.jfrog.io
          username: ${{ secrets.ARTIFACTORY_USER }}
          password: ${{ secrets.ARTIFACTORY_PASSWORD }}
      
      # Build and push
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: |
            trialsga2025.jfrog.io/sga-docker-local/batata2:${{ github.sha }}
            trialsga2025.jfrog.io/sga-docker-local/batata2:latest